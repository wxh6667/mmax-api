name: 代码语法检查

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查 Python 语法
        run: python -m compileall -q mmax_api scripts/prepare_krea.py

      - name: 检查 Shell 语法
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - name: 检查 New API 插件语法
        run: node --input-type=module --check < integrations/new-api/minimax-h3/plugin.js
